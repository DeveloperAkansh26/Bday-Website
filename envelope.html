<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For you 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf3e6;--paper:#fffdf7;--blush:#f7d6d9;--rose:#e8909f;--red:#b3263e;--brown:#6b4332;--beige:#ecd5b8;--lw:min(88vw,470px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;overflow:hidden;color:var(--brown);font-family:'Cormorant Garamond',Georgia,serif;background:radial-gradient(ellipse at 50% 25%,#fffaf2,#f6e6d2 55%,#efd2cc 100%)}
.s{font-family:'Caveat',cursive}
.fl{position:fixed;bottom:-40px;pointer-events:none;color:var(--rose);animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
.bu{position:fixed;z-index:99;font-style:normal;pointer-events:none;animation:bu 1.6s ease-out forwards}
@keyframes bu{to{transform:translate(var(--x),var(--y)) rotate(300deg) scale(1.5);opacity:0}}

.scene{position:relative;z-index:2;--w:min(86vw,440px);width:var(--w);height:calc(var(--w)*.66);perspective:1100px}
.scene>*{position:absolute}
.back{inset:0;z-index:1;background:var(--beige);border-radius:6px;box-shadow:0 30px 60px #6b433240}
.flap{inset:0;z-index:6;transform-origin:top;clip-path:polygon(0 0,100% 0,50% 55%);background:linear-gradient(180deg,#f2cdc3,#e9b3aa);transition:transform .9s cubic-bezier(.5,0,.2,1),background .9s}
.shade{inset:0;z-index:4;clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);background:#d9b99a}
.front{inset:0;z-index:5;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);background:linear-gradient(165deg,#f8e4d3,#efcdbd);border-radius:0 0 6px 6px}
.back,.flap,.shade,.front{transition:transform 1.3s cubic-bezier(.6,0,.3,1),opacity 1s}
.scene.open .flap{transform:rotateX(180deg);background:linear-gradient(0deg,#fbe9e1,#f1cfc5)}
.scene.behind .flap{z-index:2}
.seal{left:50%;top:55%;z-index:7;width:56px;height:56px;border:0;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%);color:#ffe9e6;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,#d9475e,var(--red) 60%,#7d1527);box-shadow:0 5px 14px #7d152766,inset 0 -3px 6px #0004;animation:pl 1.6s infinite;transition:transform .5s,opacity .5s}
@keyframes pl{50%{transform:translate(-50%,-50%) scale(1.12)}}
.scene.open .seal{animation:none;transform:translate(-50%,-50%) scale(2);opacity:0;pointer-events:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
.hint{position:absolute;left:50%;top:calc(100% + 2.2rem);transform:translateX(-50%);font-size:1.9rem;color:var(--red);white-space:nowrap;transition:opacity .5s}
.scene.open .hint{opacity:0}

.letter{left:50%;top:16%;z-index:3;width:70%;height:80%;transform:translateX(-50%);overflow:hidden;background:var(--paper);border-radius:4px;box-shadow:0 6px 20px #6b433233;border-top:6px solid var(--blush);transition:top 1.1s cubic-bezier(.3,.7,.3,1),height 1.1s cubic-bezier(.3,.7,.3,1)}
.scene{transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
.scene.rise{transform:translateY(calc(var(--w)*.39))}
.scene.rise .letter{top:-117%;height:175%}
.in{padding:calc(var(--w)*.07) calc(var(--w)*.05);text-align:center;min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:calc(var(--w)*.025);background:repeating-linear-gradient(transparent 0 33px,#f5e6dc 33px 34px)}
.ln{opacity:0}
.scene.done .ln{animation:fi 1.1s forwards;animation-delay:calc(var(--i)*.55s + .9s)}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ti{font-size:calc(var(--w)*.17);line-height:.95;color:var(--red)}
.nm{font-size:calc(var(--w)*.085);color:var(--rose)}
.p{font-size:calc(var(--w)*.052);line-height:1.45;font-style:italic}
.sg{font-size:calc(var(--w)*.075);color:var(--red)}
.scene.done .ti.ln{animation:pop 1.1s cubic-bezier(.3,1.6,.4,1) .2s forwards}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}

.col{position:fixed;inset:0;z-index:1;pointer-events:none}
.pic{position:absolute;left:50%;top:50%;width:min(var(--pw),210px);aspect-ratio:3/4;padding:6px 6px 20px;background:var(--paper);box-shadow:0 12px 26px #6b433255;opacity:0;pointer-events:auto;transform:translate(-50%,-50%) rotate(var(--r)) scale(.2);transition:left 1.4s cubic-bezier(.2,.9,.3,1.1),top 1.4s cubic-bezier(.2,.9,.3,1.1),transform 1.4s cubic-bezier(.2,.9,.3,1.1),opacity .8s;transition-delay:calc(var(--i)*.12s + .4s)}
.pic::before{content:"";position:absolute;top:-9px;left:50%;width:42px;height:16px;transform:translateX(-50%) rotate(-4deg);background:#f7d6d9cc}
.pic img{width:100%;height:100%;object-fit:cover;display:block;background:var(--blush)}
.pic .ph{width:100%;height:100%;display:grid;place-items:center;font-size:2.2rem;background:linear-gradient(135deg,var(--blush),#f2c4b8)}
.col.on .pic{left:var(--x);top:var(--y);opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}
.col.settled .pic{transition-delay:0s;transition-duration:.4s}
.col.on .pic:hover{transform:translate(-50%,-50%) rotate(0) scale(1.14);z-index:3}
@media(max-width:600px){:root{--lw:68vw}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head>
<body>
<div class="col" id="col"></div>
<main class="scene" id="sc">
  <div class="back"></div>
  <div class="flap"></div>
  <div class="letter"><div class="in" id="lt"></div></div>
  <div class="shade"></div>
  <div class="front"></div>
  <button class="seal" id="seal" aria-label="Open the letter">♥</button>
  <div class="hint s">Tap the seal to open</div>
</main>

<script>
/* ======== EDIT THIS PART ======== */
const C={
 name:"Muskan",
 from:"Your Love",
 title:"Happy Birthday",
 photos:[ // put images in a "photos" folder next to this file; add or remove entries freely
  "photos/1.jpeg","photos/2.jpeg","photos/3.jpeg","photos/4.jpeg","photos/5.jpeg","photos/6.jpeg",
 ],
 lines:[
  "Every part of me loves every part of you."
 ]
};
/* ================================ */
const $=s=>document.querySelector(s),R=Math.random;
let i=0;const L=[`<div class="ln s ti" style="--i:${i++}">${C.title.replace(' ','<br>')}</div>`,`<div class="ln s nm" style="--i:${i++}">${C.name} 💗</div>`];
C.lines.forEach(t=>L.push(`<p class="ln p" style="--i:${i++}">${t}</p>`));
L.push(`<div class="ln s sg" style="--i:${i++}">— ${C.from} ♥</div>`);
$('#lt').innerHTML=L.join('');
const mob=matchMedia('(max-width:700px)').matches;
/* slots: x%, y%, width(vw), rotation(deg) — alternating left/right */
const SL=mob?[[22,9,24,-8],[78,8,24,8],[22,92,24,7],[78,93,24,-7]]
:[[10,24,15,-9],[90,26,15,8],[16,68,16,6],[84,70,16,-6],[26,10,12,6],[74,88,13,-7]];
const em=['💕','🌹','🌸','🧸','💌','🎀'],col=$('#col');
C.photos.slice(0,SL.length).forEach((src,k)=>{const [x,y,w,r]=SL[k],d=document.createElement('div');d.className='pic';
 d.style.cssText=`--x:${x}%;--y:${y}%;--pw:${w}vw;--r:${r}deg;--i:${k}`;d.innerHTML=`<img src="${src}" alt="">`;
 d.firstChild.onerror=ev=>ev.target.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:em[k%6]}));col.append(d)});

for(let k=0;k<14;k++){const h=document.createElement('i');h.className='fl';h.textContent='♥';h.style.cssText=`left:${R()*100}vw;font-size:${12+R()*20}px;opacity:${.15+R()*.3};animation-duration:${12+R()*14}s;animation-delay:${-R()*20}s`;document.body.append(h)}

function burst(x,y,n=28,ch=['💖','💗','🌸','✨','🤍']){for(let k=0;k<n;k++){const e=document.createElement('i');e.className='bu';e.textContent=ch[k%ch.length];const a=R()*6.28,d=70+R()*200;e.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-70}px`;document.body.append(e);setTimeout(()=>e.remove(),1700)}}

const sc=$('#sc');let state=0;
function open(){if(state)return;state=1;const b=$('#seal').getBoundingClientRect();burst(b.left+28,b.top+28,22);
 sc.classList.add('open');
 setTimeout(()=>sc.classList.add('behind'),450);
 setTimeout(()=>sc.classList.add('rise'),950);
 setTimeout(()=>{sc.classList.add('done');col.classList.add('on');setTimeout(()=>col.classList.add('settled'),4000);burst(innerWidth/2,innerHeight/2,36)},2200);
 setTimeout(()=>state=2,3000)}
$('#seal').onclick=open;
addEventListener('pointerdown',e=>{if(state==2)burst(e.clientX,e.clientY,8,['💗','✨'])});
</script>
</body></html>
